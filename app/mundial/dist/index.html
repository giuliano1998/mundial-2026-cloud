<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundial 2026 - Cloud</title>

    <!-- sap.ui.comp (FilterBar) y sap.viz (gráfico) tienen que estar
         también en dependencies.libs del manifest: acá se resuelven en
         runtime, allá las necesita el build del Component-preload. -->
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.ui.core,sap.ui.layout,sap.ui.comp,sap.viz"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-resourceroots='{"mundial": "./"}'
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport">
    </script>

    <style>
        /* Ancla la cadena de alturas: sin esto height:100% se resuelve
           contra "auto" y toda la cadena colapsa a 0px. */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body class="sapUiBody">

    <!-- ComponentSupport solo lee atributos data-*. Un style inline acá
         se descarta sin aviso; el alto va por data-height. -->
    <div
        data-sap-ui-component
        data-name="mundial"
        data-id="container"
        data-settings='{"id": "mundial"}'
        data-height="100%">
    </div>

</body>
</html>
